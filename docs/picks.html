<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SEMon Picks</title>
<link rel="icon" href="./favicon.svg" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet" />
<style>
:root{--ink:#1f2937;--ink2:#6b7280;--ink3:#9ca3af;--rule:#e5e7eb;--rule2:#f3f4f6;--wash:#f9fafb;
  --boom:#dc2626;--bust:#2563eb;--on:#b91c1c;--off:#1d4ed8;--idx:#6b7280;--stk:#dc2626;--cash:#93c5fd}
body{font-variant-numeric:tabular-nums}
.ko{display:block;font-size:11px;font-weight:400;color:var(--ink3);line-height:1.3}
.ko-i{font-size:12px;font-weight:400;color:var(--ink3);margin-left:6px}
.up{color:var(--boom)} .dn{color:var(--bust)}
.header-inner{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
.nav-links{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav-links a{white-space:nowrap}
.pill-on{background:#1f2937 !important;color:#fff !important}
.panel{background:#fff;border:1px solid #f3f4f6;border-radius:.5rem;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ptitle{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ptitle h2{font-size:1.05rem;font-weight:700;color:var(--ink);margin:0}
.ptitle p{font-size:12px;color:var(--ink3);margin:0;max-width:52em}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center}
.kicker{font-size:13px;color:var(--ink2)}
.big{font-size:clamp(40px,5vw,58px);line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:6px 0 0}
.big-ko{font-size:16px;color:var(--ink2);margin-top:6px}
.desc{font-size:14.5px;color:var(--ink);margin-top:12px;max-width:40em}
.chip{display:inline-block;padding:1px 8px;font-size:12px;font-weight:600;border-radius:4px;background:var(--rule2);color:var(--ink)}
.alloc{display:flex;height:34px;border-radius:6px;overflow:hidden;margin-top:6px}
.alloc div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden}
.alegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--ink2)}
.alegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--c)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
.metric{background:var(--wash);border-radius:6px;padding:10px 12px}
.metric .k{font-size:12.5px;font-weight:600;color:var(--ink)}
.metric .v{font-size:28px;font-weight:700;line-height:1.15;margin-top:4px;color:var(--ink)}
.metric .d{font-size:12px;color:var(--ink2)}
.box{position:relative}
.box svg{display:block;width:100%;height:auto;overflow:visible}
.box svg text{font-size:11px;fill:var(--ink2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:16px;border-top:2px solid var(--c);vertical-align:middle;margin-right:5px}
.legend span.blk::before{border-top-width:8px;width:10px}
.tip{position:absolute;pointer-events:none;background:#1e293b;color:#f1f5f9;padding:6px 10px;font-size:11.5px;line-height:1.5;white-space:nowrap;display:none;z-index:50;border-radius:6px}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--rule2);white-space:nowrap}
th{font-weight:600;font-size:12px;color:var(--ink);border-bottom:1px solid var(--rule);vertical-align:bottom}
th .ko,td .ko{font-size:10.5px}
th:first-child,td:first-child{text-align:left;padding-left:0}
td.nm{text-align:left}
td.nm b{font-weight:600;color:var(--ink)}
td.nm small{color:var(--ink3);margin-left:4px}
td.sec{text-align:left;color:var(--ink2)}
th.l{text-align:left}
.bar{display:inline-block;width:46px;height:6px;background:var(--rule2);border-radius:2px;vertical-align:middle;margin-left:6px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--c,#9ca3af)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:0 6px;border-radius:3px;margin-left:6px}
.tag.new{background:#fee2e2;color:#b91c1c}
.tag.ex{background:#dbeafe;color:#1d4ed8}
.tag.out{background:var(--rule2);color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips span{font-size:12px;padding:2px 8px;border-radius:4px;background:var(--wash);border:1px solid var(--rule)}
.note{font-size:12px;color:var(--ink2);margin-top:10px}
.warn{font-size:13px;padding:8px 12px;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;color:#92400e;margin-bottom:16px}
.offnote{font-size:13px;padding:8px 12px;background:#eff6ff;border-radius:6px;color:#1e3a8a;margin-bottom:12px}
.method{font-size:12.5px;color:#4b5563;display:grid;grid-template-columns:1fr 1fr;gap:6px 32px}
.method p{margin:0 0 8px}
.method b{color:var(--ink)}
.mt{width:100%;font-size:12px;margin-top:4px}
.mt td,.mt th{padding:4px 6px}
details.more summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);padding:4px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ ";color:var(--ink3)}
details.more[open] summary::before{content:"▾ "}
@media (max-width:1100px){.hero,.two{grid-template-columns:minmax(0,1fr);gap:16px}.method{grid-template-columns:1fr}}
@media (max-width:640px){h1{font-size:1.4rem !important}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.hide-sm{display:none}}
</style>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto px-4 py-6 max-w-screen-2xl">
  <header class="mb-6">
    <div class="header-inner">
      <div>
        <h1 class="text-3xl font-bold text-gray-800">Picks <span class="text-lg font-normal text-gray-400">Multi-Factor Stock Selection — Korea</span></h1>
        <div class="text-sm text-gray-500 mt-1" id="status">Loading...</div>
      </div>
      <div class="nav-links" id="nav"></div>
    </div>
  </header>
  <div id="loading" class="bg-white rounded-lg shadow-md p-8 text-center text-gray-500">Loading Data...</div>
  <main id="app"></main>
</div>
<div class="tip" id="tip"></div>
<script>
const NAV=[{href:"reflex.html",label:"Reflex"},{href:"picks.html",label:"Picks",cur:true},{href:"index.html",label:"RRG"},{href:"momentum.html",label:"Momentum"},{href:"heatmap.html",label:"Heatmap"},{href:"stats.html",label:"Stats"},{href:"cal.html",label:"Calendar"},{href:"https://eqmon.duckdns.org",home:true}];
const STAGE={1:["Inception","초기 회복"],2:["Acceleration","상승 가속"],3:["Confirmation","확인"],4:["Conviction","확산"],5:["Overshoot","과열"],6:["Reversal","반전"],7:["Twilight","둔화"],8:["Deterioration","악화"],9:["Capitulation","투매"]};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=(v,d=1)=>v==null||isNaN(v)?"—":(v>0?"+":v<0?"−":"")+Math.abs(v*100).toFixed(d)+"%";
const tone=v=>v==null?"":v>0?"up":v<0?"dn":"";
const p100=v=>v==null?null:Math.round((v+0.5)*100);
const bar=(v,c)=>v==null?"—":`${p100(v)}<span class="bar" style="--c:${c}"><i style="width:${Math.max(2,Math.min(100,p100(v)))}%"></i></span>`;
$("#nav").innerHTML=NAV.map(n=>n.home
  ?`<a href="${n.href}" style="font-size:12px;color:#fff;text-decoration:none;padding:4px 10px;border:1px solid #334155;border-radius:6px;background:#1e293b;">HOME</a>`
  :`<a href="${n.href}" class="px-3 py-1 text-xs rounded bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors font-medium${n.cur?" pill-on":""}"${n.cur?' aria-current="page"':""}>${esc(n.label)}</a>`).join("");
fetch("data/picks.json?t="+Date.now()).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(render).catch(e=>{
  $("#loading").innerHTML=`<span class="text-red-500">데이터 로드 실패 (${esc(e.message)})</span>`;});

function render(d){
  $("#loading").style.display="none";
  const a=d.data_asof||{}, g=d.regime||{}, P=d.portfolio||{}, L=d.ledger||{}, perf=L.perf;
  $("#status").innerHTML=`Last Update: <span class="font-medium text-gray-700">${esc(d.generated)}</span> &nbsp;|&nbsp; As of: <span class="font-medium text-gray-700">${esc(d.as_of)} 장 마감</span> &nbsp;|&nbsp; <span class="text-gray-400">Flows ${esc(a.flow)} · EPS ${esc(a.fund)} · Sectors ${esc(a.sector)}</span>`;
  const on=!!g.up, st=STAGE[g.stage]||["—",""];
  const al=g.alloc||{index:0,stocks:0,cash:1};
  const seg=(v,c,lab)=>v>0?`<div style="width:${v*100}%;background:${c}">${lab} ${Math.round(v*100)}%</div>`:"";
  const stale=(d.stale||[]).length?`<div class="warn">데이터 지연: ${d.stale.map(k=>({flow:"수급(Flows)",fund:"실적(EPS)"}[k]||k)+" "+esc(a[k])).join(", ")} 기준입니다. KRX 수집이 막혔을 수 있어 점수는 마지막으로 받은 값으로 계산했습니다.</div>`:"";
  const H=P.holdings||[], addSet=new Set((P.added||[]).map(x=>x.t));
  const hRows=H.map((h,i)=>`<tr><td>${i+1}</td>
    <td class="nm"><b>${esc(h.n)}</b><small>${esc(h.t)}</small>${addSet.has(h.t)?'<span class="tag new">NEW</span>':""}${h.rank==null||h.rank>(d.params?.buffer||100)?'<span class="tag out">순위 밖</span>':""}</td>
    <td class="sec">${esc(h.s||"—")}</td><td>${h.rank??"—"}</td>
    <td>${bar(h.hs,"#f87171")}</td><td>${bar(h.gs,"#fb923c")}</td><td class="hide-sm">${bar(h.rk,"#94a3b8")}</td>
    <td><b>${p100(h.all)??"—"}</b></td><td class="${tone(h.ret)}">${pct(h.ret)}</td></tr>`).join("");
  const R=d.ranking||[], hold=new Set(H.map(x=>x.t));
  const rRows=R.map(h=>`<tr><td>${h.rank}</td><td class="nm"><b>${esc(h.n)}</b><small>${esc(h.t)}</small>${hold.has(h.t)?'<span class="tag ex">보유</span>':""}</td>
    <td class="sec">${esc(h.s||"—")}</td><td>${p100(h.hs)}</td><td>${p100(h.gs)}</td><td class="hide-sm">${p100(h.rk)}</td><td><b>${p100(h.all)}</b></td>
    <td class="hide-sm">${h.hi52==null?"—":Math.round(h.hi52*100)+"%"}</td><td class="hide-sm ${tone(h.r21)}">${pct(h.r21)}</td></tr>`).join("");
  const S=d.sectors||[];
  const sRows=S.map(s=>`<tr><td>${s.rank}</td><td class="nm"><b>${esc(s.s)}</b>${s.excl?'<span class="tag ex">제외</span>':""}</td>
    <td class="${tone(s.r12)}">${pct(s.r12,0)}</td><td>${s.nh==null?"—":Math.round(s.nh*100)+"%"}</td><td>${s.n}</td></tr>`).join("");
  const chips=(xs)=>xs&&xs.length?`<div class="chips">${xs.map(x=>`<span>${esc(x.n)}</span>`).join("")}</div>`:`<div class="note">없음</div>`;
  const metr=perf?`<div class="metrics">
      <div class="metric"><div class="k">Engine <span class="ko-i">가상 운용</span></div><div class="v ${tone(perf.strat)}">${pct(perf.strat)}</div><div class="d">${esc(L.start)} 이후 ${perf.days}거래일</div></div>
      <div class="metric"><div class="k">Market <span class="ko-i">시장(시총가중)</span></div><div class="v ${tone(perf.mkt)}">${pct(perf.mkt)}</div><div class="d">같은 기간</div></div>
      <div class="metric"><div class="k">Max Drawdown <span class="ko-i">엔진 최대 낙폭</span></div><div class="v">${pct(perf.mdd)}</div><div class="d">시장 ${pct(perf.mdd_mkt)}</div></div>
      <div class="metric"><div class="k">Excess <span class="ko-i">초과 수익</span></div><div class="v ${tone(perf.strat-perf.mkt)}">${pct(perf.strat-perf.mkt)}</div><div class="d">엔진 − 시장</div></div></div>`
    :`<div class="note">가상 운용은 ${esc(L.start||d.as_of)}에 시작했습니다. 거래일이 쌓이면 성과가 여기에 표시됩니다.</div>`;

  $("#app").innerHTML=`${stale}
  <section class="panel p-5 md:p-6 mb-6"><div class="hero">
    <div>
      <div class="kicker">Market Regime Filter <span class="ko-i">시장 국면 필터</span> · Reflex <a href="reflex.html" class="chip" style="text-decoration:none">${g.stage??"—"} ${esc(st[0])} · ${esc(st[1])}</a></div>
      <div class="big" style="color:${on?"var(--on)":"var(--off)"}">${on?"Risk-On":"Risk-Off"}</div>
      <div class="big-ko">${on?"지수 ETF 50% + 엔진 50종목 50%":"현금(단기채) 100% — 종목은 대기 명단"}</div>
      <div class="desc">${on
        ?"Reflex가 상승 쪽 단계(1~5)라 주식을 보유합니다. 절반은 시장 지수 ETF(예: KODEX 200), 절반은 아래 50종목을 1%씩 담는 구성입니다."
        :"Reflex가 하락 쪽 단계(6~9)라 주식을 보유하지 않습니다. 2011~2026년 검증에서 하락 국면에는 종목을 잘 골라도 시장 하락을 피하지 못했습니다. 상승 단계로 돌아오면 다음 거래일에 지수 ETF와 아래 종목으로 다시 들어갑니다."}</div>
    </div>
    <div>
      <div class="kicker">Recommended Allocation <span class="ko-i">권장 배분</span></div>
      <div class="alloc">${seg(al.index,"var(--idx)","Index")}${seg(al.stocks,"var(--stk)","Stocks")}${seg(al.cash,"var(--cash)","Cash")}</div>
      <div class="alegend"><span style="--c:var(--idx)"><i></i>시장 지수 ETF</span><span style="--c:var(--stk)"><i></i>엔진 50종목 (각 1%)</span><span style="--c:var(--cash)"><i></i>현금·단기채</span></div>
      ${metr}
    </div></div></section>

  <section class="panel p-5 md:p-6 mb-6">
    <div class="ptitle"><h2>Paper Track <span class="ko-i">가상 운용 장부</span></h2><p>위 규칙을 그대로 따랐을 때의 매일 성과입니다. 거래비용(종목 편도 0.25%, ETF 0.05%)과 현금 CD 금리를 반영합니다. 실제 돈을 넣기 전 2~3개월 실시간 검증용입니다.</p></div>
    <div class="legend mb-2"><span style="--c:#dc2626">Engine 엔진</span><span style="--c:#6b7280">Market 시장(시총가중)</span><span class="blk" style="--c:#dbeafe">Risk-Off 구간</span></div>
    <div class="box" id="chart"></div>
  </section>

  <section class="panel p-5 md:p-6 mb-6">
    <div class="ptitle"><h2>Portfolio <span class="ko-i">이번 달 50종목 · ${esc(P.rebal_date)} 교체</span></h2><p>매월 첫 거래일에 종합 점수 상위 50종목으로 바꿉니다. 기존 종목은 오늘 순위가 ${d.params?.buffer||100}위 안이면 유지해 매매를 줄입니다. 한 업종은 최대 ${d.params?.max_group||10}종목(금융·보험·은행·증권은 하나로 계산)까지 담습니다. 점수는 600종목 안의 백분위(0~100)입니다.</p></div>
    ${on?"":`<div class="offnote">현재 Risk-Off라 실제로는 보유하지 않는 대기 명단입니다. 상승 국면으로 바뀌면 이 종목들로 들어갑니다.</div>`}
    <div class="scroll"><table>
      <thead><tr><th>#</th><th class="l">Stock<span class="ko">종목</span></th><th class="l">Sector<span class="ko">업종</span></th><th>Rank<span class="ko">오늘 순위</span></th>
      <th>Quality<span class="ko">실적·수급</span></th><th>Trend<span class="ko">추세</span></th><th class="hide-sm">Low Vol<span class="ko">저변동성</span></th><th>Composite<span class="ko">종합</span></th><th>Since<span class="ko">교체 후 수익</span></th></tr></thead>
      <tbody>${hRows}</tbody></table></div>
    <div class="two mt-4"><div><div class="text-sm font-semibold text-gray-700">이번 교체에서 편입 (${(P.added||[]).length})</div>${chips(P.added)}</div>
      <div><div class="text-sm font-semibold text-gray-700">이번 교체에서 편출 (${(P.removed||[]).length})</div>${chips(P.removed)}</div></div>
  </section>

  <div class="two mb-6">
    <section class="panel p-5 md:p-6">
      <details class="more"><summary>Today's Ranking <span class="ko-i">오늘 종합 순위 상위 100</span></summary>
      <p class="note">매일 바뀌는 순위입니다. 실제 교체는 월 1회만 합니다.</p>
      <div class="scroll"><table>
        <thead><tr><th>#</th><th class="l">Stock<span class="ko">종목</span></th><th class="l">Sector<span class="ko">업종</span></th><th>Quality<span class="ko">실적·수급</span></th><th>Trend<span class="ko">추세</span></th><th class="hide-sm">Low Vol<span class="ko">저변동성</span></th><th>Composite<span class="ko">종합</span></th><th class="hide-sm">52W<span class="ko">고점 대비</span></th><th class="hide-sm">1M<span class="ko">1개월</span></th></tr></thead>
        <tbody>${rRows}</tbody></table></div></details>
    </section>
    <section class="panel p-5 md:p-6">
      <div class="ptitle"><h2>Sector Momentum <span class="ko-i">업종 상대강도</span></h2><p>12개월 상대 수익(최근 1개월 제외)과 52주 신고가 근처 종목 비율로 매깁니다. Risk-On일 때 하위 ${d.params?.excl||5}개 업종 종목은 편입하지 않습니다.</p></div>
      <div class="scroll"><table>
        <thead><tr><th>#</th><th class="l">Sector<span class="ko">업종</span></th><th>12M<span class="ko">12개월</span></th><th>Near High<span class="ko">신고가 근처</span></th><th>N<span class="ko">종목 수</span></th></tr></thead>
        <tbody>${sRows}</tbody></table></div>
    </section>
  </div>

  <section class="panel p-5 md:p-6 mb-6">
    <div class="ptitle"><h2>Method <span class="ko-i">방법과 근거</span></h2></div>
    <div class="method">
      <div>
      <p><b>Process</b> <span class="text-gray-400">운용 절차</span> — ① 시장 국면 필터: Reflex 단계가 1~5면 주식 보유(Risk-On), 6~9면 현금(Risk-Off). ② 업종 필터: Risk-On일 때 Sector Momentum 하위 5개 업종 제외. ③ 종목 순위: 아래 세 팩터의 평균으로 상위 50종목, 월 1회 리밸런싱.</p>
      <p><b>Quality</b> <span class="text-gray-400">실적·수급</span> — 흑자 여부, 이익수익률(E/P), 1년 EPS 증가율, 60일 외국인+기관 순매수(시가총액 대비), 소속 업종의 Sector Momentum(12개월 상대수익).</p>
      <p><b>Trend</b> <span class="text-gray-400">추세</span> — 52주 고점 근접도와 최근 1개월 단기 반전(−1개월 수익률). 검증에서 1~3개월 급등과 거래량 급증 종목은 이후 수익이 낮았고, 52주 고점 근처에서 완만하게 오르는 종목이 좋았습니다.</p>
      <p><b>Low Vol</b> <span class="text-gray-400">저변동성</span> — 60일 변동성이 낮을수록 높은 점수. 한국 시장에서 가장 꾸준했던 팩터입니다.</p>
      </div>
      <div>
      <p><b>검증 (2011.1~2026.10, 거래비용 왕복 0.5%, 배당 제외)</b></p>
      <table class="mt"><thead><tr><th class="l">전략</th><th>연수익</th><th>최대 낙폭</th></tr></thead><tbody>
        <tr><td>시장(시총가중) 보유</td><td>5.8%</td><td>−46%</td></tr>
        <tr><td>지수 50 + 엔진 50 + Reflex</td><td>9.2%</td><td>−18%</td></tr>
        <tr><td>지수 + Reflex</td><td>10.3%</td><td>−19%</td></tr>
        <tr><td>엔진 50종목, 국면 필터 없음</td><td>5.5%</td><td>−56%</td></tr></tbody></table>
      <p class="mt-2">시장 국면 필터가 성과 차이의 대부분을 만들었습니다. 종목 엔진은 넓은 장세(2011~18)에서 지수보다 나았고, 대형주 쏠림 장세(2019~)에서는 뒤졌습니다. Reflex 규칙은 같은 기간 데이터로 정했고, 2026년 하락 회피의 비중이 커서 실제 성과는 이보다 낮을 수 있습니다. 매매 신호가 아니라 참고용입니다.</p>
      </div>
    </div>
  </section>`;
  drawChart(L.series||[]);
}

function drawChart(S){
  const box=$("#chart");
  if(S.length<2){box.innerHTML=`<div class="note">거래일이 2일 이상 쌓이면 그래프가 표시됩니다.</div>`;return;}
  const W=900,H=260,m={l:44,r:12,t:10,b:24},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const xs=i=>m.l+i/(S.length-1)*iw;
  const vals=S.flatMap(r=>[r[1],r[2]]).filter(v=>v!=null);
  let lo=Math.min(...vals),hi=Math.max(...vals); const pad=(hi-lo)*0.08||0.02; lo-=pad; hi+=pad;
  const ys=v=>m.t+(hi-v)/(hi-lo)*ih;
  let off="";for(let i=0;i<S.length;i++){if(S[i][3]===0){let j=i;while(j+1<S.length&&S[j+1][3]===0)j++;off+=`<rect x="${xs(i)}" y="${m.t}" width="${Math.max(1,xs(j)-xs(i))}" height="${ih}" fill="#dbeafe" opacity=".6"/>`;i=j;}}
  const line=(k,c,w)=>`<path d="${S.map((r,i)=>(i?"L":"M")+xs(i).toFixed(1)+" "+ys(r[k]).toFixed(1)).join("")}" fill="none" stroke="${c}" stroke-width="${w}"/>`;
  const ticks=5,yt=[...Array(ticks)].map((_,i)=>lo+(hi-lo)*i/(ticks-1));
  const xt=[0,Math.floor((S.length-1)/2),S.length-1];
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="가상 운용 누적 성과">
    ${off}${yt.map(v=>`<line x1="${m.l}" x2="${W-m.r}" y1="${ys(v)}" y2="${ys(v)}" stroke="#f3f4f6"/><text x="${m.l-6}" y="${ys(v)+4}" text-anchor="end">${((v-1)*100).toFixed(0)}%</text>`).join("")}
    <line x1="${m.l}" x2="${W-m.r}" y1="${ys(1)}" y2="${ys(1)}" stroke="#9ca3af" stroke-dasharray="3 3"/>
    ${line(2,"#6b7280",1.5)}${line(1,"#dc2626",2.2)}
    ${xt.map(i=>`<text x="${xs(i)}" y="${H-6}" text-anchor="${i===0?"start":i===S.length-1?"end":"middle"}">${S[i][0]}</text>`).join("")}
    <line id="hx" y1="${m.t}" y2="${m.t+ih}" stroke="#1f2937" stroke-width=".7" style="display:none"/>
    <rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/></svg>`;
  const svg=box.querySelector("svg"),tip=$("#tip"),hx=svg.querySelector("#hx");
  svg.querySelector("#hit").addEventListener("mousemove",e=>{
    const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(S.length-1,Math.round((x-m.l)/iw*(S.length-1))));
    hx.setAttribute("x1",xs(i));hx.setAttribute("x2",xs(i));hx.style.display="";
    const s=S[i];tip.innerHTML=`${s[0]}<br>엔진 ${pct(s[1]-1)} · 시장 ${pct(s[2]-1)}<br>${s[3]?"Risk-On":"Risk-Off"}`;
    tip.style.display="block";tip.style.left=(e.pageX+12)+"px";tip.style.top=(e.pageY-10)+"px";});
  svg.querySelector("#hit").addEventListener("mouseleave",()=>{tip.style.display="none";hx.style.display="none";});
}
</script>
</body>
