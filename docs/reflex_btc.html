<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SEMon Reflexivity Bitcoin</title>
<link rel="icon" href="./favicon.svg" />
<link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet" />
<style>
:root{
  --ink:#1f2937;--ink2:#6b7280;--ink3:#9ca3af;--rule:#e5e7eb;--rule2:#f3f4f6;--wash:#f9fafb;
  --boom:#dc2626;--bust:#2563eb;
}
body{font-variant-numeric:tabular-nums}
.ko{display:block;font-size:11px;font-weight:400;color:var(--ink3);line-height:1.3;letter-spacing:0}
.ko-i{font-size:12px;font-weight:400;color:var(--ink3);margin-left:6px}
.up{color:var(--boom)} .dn{color:var(--bust)}
.header-inner{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
.nav-links{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav-links a{white-space:nowrap}
.pill-on{background:#1f2937 !important;color:#fff !important}
.panel{background:#fff;border:1px solid #f3f4f6;border-radius:.5rem;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ptitle{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ptitle h2{font-size:1.05rem;font-weight:700;color:var(--ink);margin:0}
.ptitle p{font-size:12px;color:var(--ink3);margin:0;max-width:46em}

/* hero */
.hero{display:grid;grid-template-columns:460px minmax(0,1fr);gap:32px;align-items:center}
.dial svg{width:100%;height:auto;display:block}
.kicker{font-size:13px;color:var(--ink2)}
.tag{display:inline-block;padding:1px 8px;margin-left:6px;font-size:12px;font-weight:600;color:#fff;border-radius:4px;background:var(--c)}
.sname{font-size:clamp(40px,5vw,60px);line-height:1.05;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin:6px 0 0}
.sname-ko{font-size:16px;color:var(--ink2);margin-top:6px}
.sdesc{font-size:15px;color:var(--ink);margin-top:12px}
.since{font-size:13px;color:var(--ink2);margin-top:6px}
.watch{margin-top:14px;display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;padding:8px 12px;border-left:3px solid var(--c);background:var(--wash);border-radius:0 6px 6px 0}
.watch > *{white-space:nowrap}
.pips{display:inline-flex;gap:3px}
.pips i{width:16px;height:5px;background:var(--rule);border-radius:1px}
.pips i.on{background:var(--c)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.metric{background:var(--wash);border-radius:6px;padding:10px 12px}
.metric .k{font-size:12.5px;font-weight:600;color:var(--ink)}
.metric .v{font-size:34px;font-weight:700;line-height:1.1;margin-top:4px;color:var(--ink)}
.metric .d{font-size:12px;color:var(--ink2)}

/* drivers */
.drivers{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.dh h3{font-size:1rem;font-weight:700;color:var(--ink);margin:0}
.dh .v{font-size:28px;font-weight:700;line-height:1;color:var(--ink);text-align:right}
.dh .v small{display:block;font-size:12px;font-weight:400;color:var(--ink2);margin-top:4px}
.scale,.comp summary{display:grid;grid-template-columns:150px 1fr 40px 44px;gap:12px;align-items:center}
.scale{font-size:11px;color:var(--ink3);padding-bottom:4px;border-bottom:1px solid var(--rule)}
.scale .ax{display:flex;justify-content:space-between}
.scale .r{text-align:right;line-height:1.2}
.comp{border-bottom:1px solid var(--rule2)}
.comp summary{padding:8px 0;cursor:pointer;list-style:none}
.comp summary::-webkit-details-marker{display:none}
.comp summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.comp summary:hover .lab b{text-decoration:underline;text-underline-offset:3px}
.comp .lab b{font-size:13.5px;font-weight:600;color:var(--ink)}
.dv{position:relative;height:10px;background:var(--rule2);border-radius:2px}
.dv::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--ink2)}
.dv i{position:absolute;top:0;bottom:0;border-radius:2px}
.comp .sc{text-align:right;font-size:15px;font-weight:700;color:var(--ink)}
.comp .ch{text-align:right;font-size:12px}
.items{list-style:none;margin:0 0 10px;padding:4px 0 0}
.items li{display:grid;grid-template-columns:1fr auto 2.6em;gap:14px;font-size:12px;padding:3px 0 3px 12px;border-left:2px solid var(--rule)}
.items .r{color:var(--ink2);text-align:right}
.items .s{text-align:right;font-weight:600}
.short{margin-top:14px;font-size:12.5px;color:var(--ink2);display:flex;gap:12px;align-items:center;background:var(--wash);padding:8px 12px;border-radius:6px}
.short b{font-size:20px;color:var(--ink)}

/* charts */
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:24px}
.box{position:relative}
.box svg{display:block;width:100%;height:auto;overflow:visible}
.box svg text{font-size:11px;fill:var(--ink2)}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.seg{display:inline-flex;gap:4px}
.seg button{font-size:12px;font-weight:500;background:#f3f4f6;color:#374151;border:0;border-radius:4px;padding:3px 10px;cursor:pointer}
.seg button[aria-pressed=true]{background:#1f2937;color:#fff}
.seg button:focus-visible{outline:2px solid var(--bust);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:16px;border-top:2px solid var(--c);vertical-align:middle;margin-right:5px}
.legend span.dash::before{border-top-style:dashed}
.legend span.blk::before{border-top-width:8px;width:10px}
.tip{position:absolute;pointer-events:none;background:#1e293b;color:#f1f5f9;padding:6px 10px;font-size:11.5px;line-height:1.5;white-space:nowrap;display:none;z-index:50;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.35)}

/* tables */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--rule2);white-space:nowrap}
th{font-weight:600;font-size:12px;color:var(--ink);border-bottom:1px solid var(--rule);vertical-align:bottom}
th .ko,td .ko{font-size:10.5px}
th:first-child,td:first-child{text-align:left;padding-left:0}
td.st{display:flex;align-items:center;gap:8px}
td.st i{width:10px;height:10px;background:var(--c);flex:none;border-radius:2px}
td.st span{line-height:1.25}
tr.cur td{background:var(--wash);font-weight:600}
.note{font-size:12px;color:var(--ink2);margin-top:10px}
.verdict{margin-top:12px;font-size:13px;padding:8px 12px;background:var(--wash);border-radius:6px;color:var(--ink)}
.method{font-size:12.5px;color:#4b5563;display:grid;grid-template-columns:1fr 1fr;gap:6px 32px}
.method p{margin:0 0 8px}
.method b{color:var(--ink)}

@media (max-width:1100px){
  .hero{grid-template-columns:minmax(0,1fr);gap:16px}
  .dial{max-width:460px;margin:0 auto;width:100%}
  .drivers,.charts,.two{grid-template-columns:minmax(0,1fr)}
  .method{grid-template-columns:1fr}
}
@media (max-width:640px){
  h1{font-size:1.4rem !important}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .scale,.comp summary{grid-template-columns:116px 1fr 32px 40px;gap:8px}
}
@media (prefers-reduced-motion:no-preference){
  .dial .cur{animation:arrive .9s ease-out both}
  @keyframes arrive{from{opacity:.15}}
}
</style>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto px-4 py-6 max-w-screen-2xl">

  <header class="mb-6">
    <div class="header-inner">
      <div>
        <h1 class="text-3xl font-bold text-gray-800" id="h1"></h1>
        <div class="text-sm text-gray-500 mt-1" id="status">Loading...</div>
      </div>
      <div class="nav-links" id="nav"></div>
    </div>
  </header>

  <div id="loading" class="bg-white rounded-lg shadow-md p-8 text-center text-gray-500">Loading Data...</div>
  <main id="app"></main>
</div>
<div class="tip" id="tip"></div>
<script>
const CONFIG = {
  title:"SEMon Reflexivity — Bitcoin",
  subtitle:"Bitcoin", priceKo:"BTC", market247:true,
  json:"data/reflex_btc.json",
  nav:[{href:"reflex.html",label:"Reflex KR"},{href:"reflex_btc.html",label:"Reflex BTC",cur:true},{href:"index.html",label:"RRG"},{href:"momentum.html",label:"Momentum"},{href:"heatmap.html",label:"Heatmap"},{href:"stats.html",label:"Stats"},{href:"cal.html",label:"Calendar"},{href:"https://eqmon.duckdns.org",home:true}],
  verdictMin:10, dayUnit:"일", window:"3년(1,095일)", since:"2015", priceName:"BTC",
  perfBasis:"BTC",
  asof:d=>`${d.asof} UTC 일봉 (온체인 ${d.src.onchain||"—"}, 미국 ${d.src.macro||"—"})`,
  price:v=>"$"+Math.round(v).toLocaleString("en-US"),
  tick:v=>"$"+(v>=1000?(v/1000).toLocaleString("en-US")+"k":v.toLocaleString("en-US")),
  method:`<p><b>Fundamentals</b> <span class=\"text-gray-400\">형세</span> — 비트코인을 둘러싼 환경입니다. 연준 순유동성(대차대조표 − 재무부 계좌 − 역레포), 미국 실질금리, 달러인덱스, 나스닥과 VIX, 달러 스테이블코인 유통량 증가, 해시레이트와 활성 주소로 구성합니다.</p>
<p><b>Momentum</b> <span class=\"text-gray-400\">기세</span> — 시장의 반응입니다. BTC의 60·120·200일선 이격과 120일 수익률, 무기한 선물 펀딩비, MVRV(시가총액/실현시가총액), 주요 알트코인 20종의 이평선 위 비율, 방향성 거래량으로 구성합니다.</p>
<p><b>Bias</b> <span class=\"text-gray-400\">편향</span> — Momentum에서 Fundamentals를 뺀 값으로, 소로스가 말한 시장의 지배적 편향(prevailing bias)에 해당합니다. 플러스면 기대가 현실을 앞서 있다는 뜻입니다.</p>
<p><b>Stage</b> <span class=\"text-gray-400\">단계</span> — Momentum의 수준과 21일 변화, Fundamentals의 90일 변화, Bias로 정합니다. 같은 판정이 5일 이어지고 직전 단계가 21일 이상 지났을 때만 바꾸며, Fundamentals가 40 미만일 때의 반등은 Acceleration으로 보지 않습니다. 규칙은 2015~2026년 데이터로 정했고, 완전한 사이클이 3~4번뿐이라 통계 표본이 작습니다. 국면을 설명하는 지표이며 매매 신호가 아닙니다.</p>`
};

const STAGE = {
  1:{en:"Inception",ko:"유리한 형세"},2:{en:"Acceleration",ko:"상승 기세"},3:{en:"Confirmation",ko:"현실 개선"},
  4:{en:"Conviction",ko:"확신 강화"},5:{en:"Overshoot",ko:"기세 가속"},6:{en:"Reversal",ko:"반전 시작"},
  7:{en:"Twilight",ko:"기세 약화"},8:{en:"Deterioration",ko:"현실 악화"},9:{en:"Capitulation",ko:"하락 가속"}
};
const HEX={1:"#d1d5db",2:"#fecaca",3:"#fca5a5",4:"#f87171",5:"#dc2626",6:"#bfdbfe",7:"#93c5fd",8:"#60a5fa",9:"#2563eb"};
const DARKTXT=new Set([1,2,3,6,7]);
const PHASE=s=>s>=2&&s<=5?"Boom":s>=6?"Bust":"Base";
const PHASE_KO={Boom:"상승 국면",Bust:"하락 국면",Base:"바닥 국면"};
const COMP_EN={trend:"Trend",part:"Breadth",energy:"Volume",flow:"Flows",risk:"Risk Appetite",semi:"Semiconductor Cycle",
  fx:"KRW & Dollar",rate:"Rates",cycle:"Growth",liq:"Dollar Liquidity",stable:"Stablecoins",net:"Network",lev:"Leverage",
  val:"Valuation",breadth:"Alt Breadth"};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n0=v=>v==null||isNaN(v)?"—":Math.round(v).toString();
const sg=(v,d=0)=>v==null||isNaN(v)?"—":(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(d);
const tone=v=>v==null?"":v>0?"up":v<0?"dn":"";
const en=(e,k)=>`${e}<span class="ko">${k}</span>`;

function norm(j){
  const st=j.stage_stats||{},S={};
  for(const k in st){const s=st[k];S[k]={days:s.days,len:s.avg_len,fwd:s.fwd??s.fwd60,ex:s.fwd_excess??s.fwd60_excess,
    hit:s.hit??s.hit60,mdd:s.mdd??s.mdd60}}
  const ax=(a,d,sd)=>({value:a.value,d:a.dslope??a[d],sd:a.slope_days??sd,components:a.components||{}});
  return {raw:j,stage:j.stage,gap:j.gap,F:ax(j.F,"d40",40),M:ax(j.M,"d20",20),Mf:{...ax(j.Mf,"d10",10),accel:j.Mf.accel},
    horizon:j.horizon??60,stats:S,base:j.baseline?.fwd??j.baseline?.f60,
    periods:(j.phase_by_period||[]).map(p=>({name:p.period,up:{ex:p.up.fwd_excess??p.up.fwd60_excess,hit:p.up.hit??p.up.hit60},
      dn:{ex:p.down.fwd_excess??p.down.fwd60_excess,hit:p.down.hit??p.down.hit60}})),
    trans:j.transitions||{},eps:j.episodes_recent||[],hist:j.history||[],histLong:j.history_long||[],
    asof:j.as_of,src:j.sources_as_of||{us:j.us_as_of},gen:j.generated_at};
}

document.title=CONFIG.title;
$("#h1").innerHTML=`Reflexivity <span class="text-lg font-normal text-gray-400">${esc(CONFIG.subtitle)}</span>`;
$("#nav").innerHTML=CONFIG.nav.map(n=>n.home
  ?`<a href="${n.href}" style="font-size:12px;color:#fff;text-decoration:none;padding:4px 10px;border:1px solid #334155;border-radius:6px;background:#1e293b;">HOME</a>`
  :`<a href="${n.href}" class="px-3 py-1 text-xs rounded bg-gray-100 text-gray-700 hover:bg-gray-200 transition-colors font-medium${n.cur?" pill-on":""}"${n.cur?' aria-current="page"':""}>${esc(n.label)}</a>`).join("");

fetch(CONFIG.json+"?t="+Date.now()).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(j=>render(norm(j))).catch(e=>{
  $("#loading").innerHTML=`<span class="text-red-500">데이터 로드 실패 (${esc(e.message)})</span>`;
});

function marketBadge(){
  if(CONFIG.market247)return `<span class="font-bold text-gray-700">24/7</span>`;
  const now=new Date(),k=new Date(now.getTime()+(now.getTimezoneOffset()+540)*60000),t=k.getHours()*60+k.getMinutes(),wd=k.getDay()>=1&&k.getDay()<=5;
  if(wd&&t>=540&&t<=930)return `<span class="font-bold text-gray-700">KRX</span>`;
  if(wd&&((t>=480&&t<540)||(t>930&&t<=1200)))return `<span class="font-bold text-gray-600">NXT</span>`;
  return `<span class="font-bold text-gray-400">Market Closed</span>`;
}

function render(d){
  $("#loading").style.display="none";
  const st=d.stage,cur=st.id,ph=PHASE(cur),phc=ph==="Boom"?"var(--boom)":ph==="Bust"?"var(--bust)":"var(--ink3)";
  $("#status").innerHTML=`Last Update: <span class="font-medium text-gray-700">${esc(d.gen)}</span> &nbsp;|&nbsp; As of: <span class="font-medium text-gray-700">${esc(CONFIG.asof(d))}</span> &nbsp;|&nbsp; Market: ${marketBadge()}`;

  const pend=st.pending;
  const watch=pend?`<div class="watch" style="--c:${HEX[pend.id]}">
      <span>Transition Watch <span class="ko-i">전환 감시</span></span><b>${STAGE[pend.id].en}</b><span class="text-gray-400">${STAGE[pend.id].ko}</span>
      <span class="pips" aria-label="${pend.count}/${pend.need}일 확인">${Array.from({length:pend.need},(_,i)=>`<i class="${i<pend.count?"on":""}"></i>`).join("")}</span>
      <span class="text-gray-500">${pend.count}/${pend.need}일 확인</span></div>`:"";
  const nxt=Object.entries(d.trans[String(cur)]||{}).slice(0,3);

  $("#app").innerHTML=`
  <section class="panel p-5 mb-4">
    <div class="hero">
      <div class="dial" id="dial"></div>
      <div>
        <div class="kicker">Stage ${cur??"—"} of 9 <span class="tag" style="--c:${phc}">${ph} Phase</span><span class="ko-i">${PHASE_KO[ph]}</span></div>
        <h2 class="sname">${cur?STAGE[cur].en:"Pending"}</h2>
        <div class="sname-ko">${cur?STAGE[cur].ko:""}</div>
        <p class="sdesc">${esc(st.desc||"")}</p>
        <div class="since">${st.since?`${st.since}부터 ${st.days}${CONFIG.dayUnit}째`:""}${nxt.length?`<br>Next stage history <span class="ko-i" style="margin-left:2px">과거 다음 단계</span>: ${nxt.map(([k,p])=>`${STAGE[k].en} ${Math.round(p)}%`).join(", ")}`:""}</div>
        ${watch}
        <div class="metrics">
          ${metric("Fundamentals","형세 — 판이 유리한가",d.F.value,d.F.d,`${d.F.sd}일 변화`)}
          ${metric("Momentum","기세 — 시장의 반응",d.M.value,d.M.d,`${d.M.sd}일 변화`)}
          ${metric("Short-term","단기 기세",d.Mf.value,d.Mf.d,`${d.Mf.sd}일 변화`)}
          ${metric("Bias","편향 — 기세 − 형세",d.gap,null,d.gap>0?"기대가 현실을 앞섬":d.gap<0?"현실이 기대를 앞섬":"균형",true)}
        </div>
      </div>
    </div>
  </section>

  <div class="drivers mb-4">
    <section class="panel p-5">${driverHead("Fundamentals","형세 구성 요소",d.F)}${scale()}${comps(d.F.components)}</section>
    <section class="panel p-5">${driverHead("Momentum","기세 구성 요소",d.M)}${scale()}${comps(d.M.components)}
      <div class="short"><span>Short-term Momentum<span class="ko">단기 기세</span></span><b>${n0(d.Mf.value)}</b><span>${esc(d.raw.Mf.accel_text||"")}</span></div>
    </section>
  </div>
  <p class="text-xs text-gray-400 mb-4" style="margin-top:-6px">* 모든 지표는 과거 ${CONFIG.window} 대비 백분위. 50이 평소 수준, 오른쪽(빨강)이 시장에 우호적 &nbsp;|&nbsp; 항목 클릭 시 실제 값 표시</p>

  <section class="panel p-5 mb-4">
    <div class="charts">
      <div>
        <div class="ptitle"><h2>Phase Map<span class="ko-i">형세·기세 궤적</span></h2><p>최근 120${CONFIG.dayUnit}</p></div>
        <div class="box" id="plane"></div>
      </div>
      <div>
        <div class="ptitle"><h2>History<span class="ko-i">${CONFIG.priceKo}와 단계 이력</span></h2></div>
        <div class="ctl">
          <div class="seg" role="group" aria-label="기간">
            <button type="button" data-r="2y" aria-pressed="true">2Y</button>
            <button type="button" data-r="all" aria-pressed="false">Since ${CONFIG.since}</button>
          </div>
          <div class="legend"><span style="--c:var(--ink)">Momentum 기세</span><span class="dash" style="--c:var(--ink3)">Fundamentals 형세</span>
            <span class="blk" style="--c:#f87171">Boom 상승 국면</span><span class="blk" style="--c:#60a5fa">Bust 하락 국면</span></div>
        </div>
        <div class="box" id="line"></div>
      </div>
    </div>
  </section>

  <div class="two mb-4">
    <section class="panel p-5">
      <div class="ptitle"><h2>Regime Log<span class="ko-i">단계 이력</span></h2></div>
      <div class="scroll"><table>
        <thead><tr><th>${en("Period","기간")}</th><th>${en("Stage","단계")}</th><th>${en("Days","일수")}</th><th>${en(CONFIG.priceName,"등락률")}</th></tr></thead>
        <tbody>${d.eps.slice().reverse().map(e=>{const ch=e.k0&&e.k1?(e.k1/e.k0-1)*100:null;
          return `<tr><td>${e.start.slice(2)} – ${e.end.slice(2)}</td><td class="st" style="--c:${HEX[e.s]}"><i></i><span>${STAGE[e.s].en}<span class="ko">${STAGE[e.s].ko}</span></span></td>
            <td>${e.days}</td><td class="${tone(ch)}">${sg(ch,1)}%</td></tr>`}).join("")}</tbody>
      </table></div>
    </section>
    <section class="panel p-5">
      <div class="ptitle"><h2>Forward Performance<span class="ko-i">단계별 이후 성과</span></h2><p>${CONFIG.since}년 이후, ${d.horizon}${CONFIG.dayUnit} 뒤까지의 ${esc(CONFIG.perfBasis)}</p></div>
      <div class="scroll"><table>
        <thead><tr><th>${en("Stage","단계")}</th><th>${en("Days","일수")}</th><th>${en("Avg Run","평균 지속")}</th><th>${en(d.horizon+"D Return","이후 수익률")}</th>
          <th>${en("vs. Avg","평균 대비")}</th><th>${en("Hit Rate","상승 확률")}</th><th>${en("Max DD","최대 낙폭")}</th></tr></thead>
        <tbody>${[1,2,3,4,5,6,7,8,9].map(i=>{const s=d.stats[i]||{};return `<tr class="${i===cur?"cur":""}">
          <td class="st" style="--c:${HEX[i]}"><i></i><span>${i} ${STAGE[i].en}<span class="ko">${STAGE[i].ko}</span></span></td><td>${s.days??"—"}</td><td>${s.len!=null?Math.round(s.len):"—"}</td>
          <td class="${tone(s.fwd)}">${sg(s.fwd,1)}%</td><td class="${tone(s.ex)}">${sg(s.ex,1)}%p</td>
          <td>${s.hit!=null?Math.round(s.hit)+"%":"—"}</td><td>${s.mdd!=null?s.mdd.toFixed(1)+"%":"—"}</td></tr>`}).join("")}</tbody>
      </table></div>
      <p class="note">* 평균 대비는 전체 평균 ${sg(d.base,1)}%와의 차이, 최대 낙폭은 해당 기간 중 고점 대비 최대 하락의 평균</p>
      ${robust(d)}
    </section>
  </div>

  <section class="panel p-5">
    <div class="ptitle"><h2>Methodology<span class="ko-i">판정 방법</span></h2></div>
    <div class="method">${CONFIG.method}</div>
  </section>`;

  drawDial(d);drawPlane(d);
  let range="2y";const redraw=()=>drawLine(range==="2y"?d.hist:d.histLong,range);redraw();
  document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
    range=b.dataset.r;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));redraw();}));
  let t;window.addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(()=>{drawPlane(d);redraw()},150)});
}

function metric(e,k,v,dv,lab,signed){
  return `<div class="metric"><div class="k">${e}<span class="ko">${k}</span></div><div class="v ${signed?tone(v):""}">${signed?sg(v):n0(v)}</div>
    <div class="d">${dv!=null?`${lab} <span class="${tone(dv)}">${sg(dv)}</span>`:esc(lab)}</div></div>`;
}
function driverHead(e,k,a){
  return `<div class="dh"><h3>${e}<span class="ko">${k}</span></h3><div class="v">${n0(a.value)}<small>${a.sd}일 변화 <span class="${tone(a.d)}">${sg(a.d)}</span></small></div></div>`;
}
function scale(){return `<div class="scale"><span></span><span class="ax"><span>0</span><span>50</span><span>100</span></span><span class="r">Score<span class="ko">점수</span></span><span class="r">Δ20D<span class="ko">20일</span></span></div>`}
function comps(cs){
  return Object.entries(cs).map(([k,c])=>{
    const v=c.score??50,left=Math.min(v,50),w=Math.abs(v-50);
    return `<details class="comp"><summary>
      <span class="lab"><b>${COMP_EN[k]||esc(c.label)}</b><span class="ko">${esc(c.label)} · 비중 ${Math.round(c.weight*100)}%</span></span>
      <span class="dv"><i style="left:${left}%;width:${w}%;background:${v>=50?"var(--boom)":"var(--bust)"}"></i></span>
      <span class="sc">${n0(c.score)}</span><span class="ch ${tone(c.d20)}">${sg(c.d20)}</span></summary>
      <ul class="items">${c.items.map(i=>`<li><span>${esc(i.label)}</span><span class="r">${esc(i.disp)}</span><span class="s">${n0(i.score)}</span></li>`).join("")}</ul>
    </details>`}).join("");
}
function robust(d){
  if(!d.periods.length)return "";
  const th=CONFIG.verdictMin, P=d.periods;
  const spread=p=>p.up.ex-p.dn.ex;                 // Boom 초과수익 − Bust 초과수익
  const ok=p=>p.up.ex>0&&p.dn.ex<0&&spread(p)>=th;  // 의미 있게 갈림
  const weak=p=>spread(p)>0;                        // 방향은 맞지만 차이가 작음
  const first=P[0],last=P[P.length-1];
  let v;
  if(P.every(ok))
    v=`두 기간 모두 Boom 구간이 평균보다 좋았고 Bust 구간이 나빴습니다(차이 ${P.map(p=>sg(spread(p),1)+"%p").join(", ")}). 일관성은 있지만 사이클 수가 적어 우연일 가능성은 남아 있습니다.`;
  else if(P.every(weak))
    v=`두 기간 모두 방향은 맞았지만 차이가 작습니다(${P.map(p=>sg(spread(p),1)+"%p").join(", ")}). 국면 설명용으로는 쓸 수 있어도 성과를 가르는 힘은 약합니다.`;
  else if(ok(last)&&!weak(first))
    v=`최근 기간(${esc(last.name)})에만 Boom과 Bust가 뚜렷하게 갈렸고, 그 이전(${esc(first.name)})엔 차이가 없었습니다. 시장 성격이 바뀐 결과일 수도, 우연일 수도 있어 매매 신호로 쓰기엔 근거가 부족합니다.`;
  else if(ok(first)&&!weak(last))
    v=`이전 기간(${esc(first.name)})엔 통했지만 최근 기간(${esc(last.name)})엔 차이가 사라졌습니다. 최근 판정은 특히 조심해서 볼 필요가 있습니다.`;
  else
    v=`기간에 따라 결과가 엇갈리거나 반대로 나왔습니다. 이 단계는 국면을 설명하는 지표로만 보고, 이후 성과에 대한 근거로 쓰지 마세요.`;
  return `<div class="scroll" style="margin-top:18px"><table><thead><tr><th>${en("Period Check","기간별 검증")}</th><th>${en("Boom vs. Avg","상승 국면 평균 대비")}</th><th>${en("Hit","상승 확률")}</th>
    <th>${en("Bust vs. Avg","하락 국면 평균 대비")}</th><th>${en("Hit","상승 확률")}</th><th>${en("Spread","차이")}</th></tr></thead>
    <tbody>${P.map(p=>`<tr><td>${esc(p.name)}</td><td class="${tone(p.up.ex)}">${sg(p.up.ex,1)}%p</td><td>${Math.round(p.up.hit)}%</td>
      <td class="${tone(p.dn.ex)}">${sg(p.dn.ex,1)}%p</td><td>${Math.round(p.dn.hit)}%</td><td class="${tone(spread(p))}">${sg(spread(p),1)}%p</td></tr>`).join("")}</tbody></table></div>
    <p class="verdict">${v}</p>`;
}

/* ── 사이클 다이얼: 5단계가 꼭대기, 왼쪽 반원 Boom, 오른쪽 반원 Bust ── */
function drawDial(d){
  const W=520,H=470,cx=W/2,cy=H/2+4,R=138,w=30,cur=d.stage.id,pend=d.stage.pending?.id;
  const ang=k=>(k-5)*40,rad=a=>(a-90)*Math.PI/180,pt=(a,r)=>[cx+r*Math.cos(rad(a)),cy+r*Math.sin(rad(a))];
  const arc=(a0,a1,r0,r1)=>{const [x0,y0]=pt(a0,r1),[x1,y1]=pt(a1,r1),[x2,y2]=pt(a1,r0),[x3,y3]=pt(a0,r0);
    return `M${x0} ${y0}A${r1} ${r1} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 0 0 ${x3} ${y3}Z`};
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="9단계 사이클 중 현재 ${cur}단계 ${cur?STAGE[cur].en:""}">`;
  s+=`<defs><marker id="ah" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6z" fill="#9ca3af"/></marker></defs>`;
  for(let k=1;k<=9;k++){
    const a=ang(k),on=k===cur;
    s+=`<path class="${on?"cur":""}" d="${arc(a-19,a+19,R-w/2-(on?7:0),R+w/2+(on?7:0))}" fill="${HEX[k]}" fill-opacity="${on?1:.45}" ${on?'stroke="#1f2937" stroke-width="1.5"':""}/>`;
    if(k===pend)s+=`<path d="${arc(a-19,a+19,R-w/2-3,R+w/2+3)}" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    const [nx,ny]=pt(a,R);
    s+=`<text x="${nx}" y="${ny+4}" text-anchor="middle" style="font-size:12px;font-weight:700;fill:${on&&!DARKTXT.has(k)?"#fff":"#1f2937"}">${k}</text>`;
    const [lx,ly]=pt(a,R+w/2+(on?18:12)),anc=Math.abs(a)<12?"middle":a<0?"end":"start",dy=Math.abs(a)<12?-16:Math.abs(a)>120?10:-2;
    s+=`<text x="${lx}" y="${ly+dy}" text-anchor="${anc}" style="font-size:${on?13:12}px;fill:${on?"#1f2937":"#6b7280"};font-weight:${on?700:500}">${STAGE[k].en}</text>`;
    s+=`<text x="${lx}" y="${ly+dy+14}" text-anchor="${anc}" style="font-size:11px;fill:#9ca3af">${STAGE[k].ko}</text>`;
  }
  const [ax0,ay0]=pt(168,R),[ax1,ay1]=pt(192,R);
  s+=`<path d="M${ax0} ${ay0}A${R} ${R} 0 0 1 ${ax1} ${ay1}" fill="none" stroke="#9ca3af" stroke-dasharray="2 3" marker-end="url(#ah)"/>`;
  const [bx,by]=pt(-128,R-w/2-14),[ux,uy]=pt(128,R-w/2-14);
  s+=`<text x="${bx}" y="${by}" text-anchor="start" style="font-size:12px;fill:#dc2626;font-weight:700">Boom</text><text x="${bx}" y="${by+13}" text-anchor="start" style="font-size:10.5px;fill:#9ca3af">상승 국면</text>`;
  s+=`<text x="${ux}" y="${uy}" text-anchor="end" style="font-size:12px;fill:#2563eb;font-weight:700">Bust</text><text x="${ux}" y="${uy+13}" text-anchor="end" style="font-size:10.5px;fill:#9ca3af">하락 국면</text>`;
  s+=`<text x="${cx}" y="${cy-34}" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#4b5563">Bias</text>`;
  s+=`<text x="${cx}" y="${cy-20}" text-anchor="middle" style="font-size:10.5px;fill:#9ca3af">편향</text>`;
  s+=`<text x="${cx}" y="${cy+22}" text-anchor="middle" style="font-size:44px;font-weight:800;fill:${d.gap>0?"#dc2626":d.gap<0?"#2563eb":"#1f2937"}">${sg(d.gap)}</text>`;
  s+=`<text x="${cx}" y="${cy+42}" text-anchor="middle" style="font-size:10.5px;fill:#9ca3af">기세 − 형세</text>`;
  $("#dial").innerHTML=s+"</svg>";
}

/* ── Phase map ── */
function drawPlane(d){
  const box=$("#plane"),W=box.clientWidth||380,H=W,m={l:40,r:10,t:10,b:44};
  const x=v=>m.l+(W-m.l-m.r)*v/100,y=v=>H-m.b-(H-m.t-m.b)*v/100;
  const P=d.hist.slice(-120).filter(p=>p.F!=null&&p.M!=null);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="형세와 기세 위상 평면, 최근 120일 궤적">`;
  s+=`<path d="M${x(0)} ${y(0)}L${x(100)} ${y(100)}L${x(0)} ${y(100)}Z" fill="#dc2626" fill-opacity=".04"/>`;
  s+=`<path d="M${x(0)} ${y(0)}L${x(100)} ${y(100)}L${x(100)} ${y(0)}Z" fill="#2563eb" fill-opacity=".04"/>`;
  s+=`<rect x="${x(0)}" y="${y(100)}" width="${x(100)-x(0)}" height="${y(0)-y(100)}" fill="none" stroke="#e5e7eb"/>`;
  s+=`<line x1="${x(50)}" x2="${x(50)}" y1="${y(0)}" y2="${y(100)}" stroke="#f3f4f6"/><line x1="${x(0)}" x2="${x(100)}" y1="${y(50)}" y2="${y(50)}" stroke="#f3f4f6"/>`;
  s+=`<line x1="${x(0)}" y1="${y(0)}" x2="${x(100)}" y2="${y(100)}" stroke="#9ca3af" stroke-dasharray="3 4"/>`;
  s+=`<text x="${x(4)}" y="${y(94)}" style="font-weight:600">Momentum leads</text><text x="${x(4)}" y="${y(94)+13}" style="fill:#9ca3af">기세가 앞섬</text>`;
  s+=`<text x="${x(96)}" y="${y(6)-13}" text-anchor="end" style="font-weight:600">Fundamentals lead</text><text x="${x(96)}" y="${y(6)}" text-anchor="end" style="fill:#9ca3af">형세가 앞섬</text>`;
  [0,50,100].forEach(v=>{s+=`<text x="${x(v)}" y="${H-m.b+15}" text-anchor="middle">${v}</text><text x="${m.l-7}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
  s+=`<text x="${x(50)}" y="${H-6}" text-anchor="middle" style="fill:#1f2937;font-weight:600">Fundamentals 형세 →</text>`;
  s+=`<text transform="translate(11 ${y(50)}) rotate(-90)" text-anchor="middle" style="fill:#1f2937;font-weight:600">Momentum 기세 →</text>`;
  for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i];
    s+=`<line x1="${x(a.F)}" y1="${y(a.M)}" x2="${x(b.F)}" y2="${y(b.M)}" stroke="#1f2937" stroke-opacity="${(.1+.9*i/P.length).toFixed(2)}" stroke-width="1.5"/>`}
  P.forEach((p,i)=>{if(i%20===0&&i<P.length-1)s+=`<circle cx="${x(p.F)}" cy="${y(p.M)}" r="3" fill="${HEX[p.s]||"#ccc"}" stroke="#fff"/>`});
  const F0=P[0],L=P[P.length-1];
  if(F0)s+=`<text x="${x(F0.F)+7}" y="${y(F0.M)+4}" style="fill:#9ca3af">${F0.d.slice(2)}</text>`;
  if(L)s+=`<circle cx="${x(L.F)}" cy="${y(L.M)}" r="7" fill="${HEX[L.s]||"#1f2937"}" stroke="#1f2937" stroke-width="2"/><text x="${x(L.F)+12}" y="${y(L.M)+4}" style="fill:#1f2937;font-weight:700">Now 현재</text>`;
  box.innerHTML=s+"</svg>";
}

/* ── 가격 + 단계 띠 + 형세·기세 ── */
function drawLine(rows,range){
  const box=$("#line"),W=box.clientWidth||620,H1=180,G=16,H2=140,H=H1+G+H2+22,m={l:52,r:6,t:4};
  const R=rows.filter(r=>r.k!=null),n=R.length,x=i=>m.l+(W-m.l-m.r)*i/(n-1);
  const ks=R.map(r=>Math.log(r.k)),lo=Math.min(...ks),hi=Math.max(...ks);
  const yk=v=>m.t+H1-6-(H1-12)*(Math.log(v)-lo)/(hi-lo),y2=v=>m.t+H1+G+H2-H2*v/100;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${CONFIG.priceName}와 단계, 형세·기세 추이">`;
  let st=0;
  for(let i=1;i<=n;i++){if(i===n||R[i].s!==R[st].s){if(R[st].s){const x0=x(Math.max(st-.5,0)),x1=x(Math.min(i-.5,n-1));
    s+=`<rect x="${x0}" y="${m.t}" width="${Math.max(x1-x0,.5)}" height="${H1}" fill="${HEX[R[st].s]}" fill-opacity="${DARKTXT.has(R[st].s)?.45:.3}"/>`}st=i}}
  ticks(Math.exp(lo),Math.exp(hi)).forEach(v=>{s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yk(v)}" y2="${yk(v)}" stroke="#fff" stroke-opacity=".8"/><text x="${m.l-6}" y="${yk(v)+4}" text-anchor="end">${CONFIG.tick(v)}</text>`});
  s+=`<path d="${R.map((r,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+yk(r.k).toFixed(1)).join("")}" fill="none" stroke="#1f2937" stroke-width="1.5"/>`;
  s+=`<text x="${m.l+6}" y="${m.t+15}" style="fill:#1f2937;font-weight:600">${CONFIG.priceName} (log)</text>`;
  [0,50,100].forEach(v=>{s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y2(v)}" y2="${y2(v)}" stroke="${v===50?"#e5e7eb":"#f3f4f6"}"/><text x="${m.l-6}" y="${y2(v)+4}" text-anchor="end">${v}</text>`});
  const path=k=>R.map((r,i)=>r[k]==null?"":((i&&R[i-1][k]!=null?"L":"M")+x(i).toFixed(1)+" "+y2(r[k]).toFixed(1))).join("");
  s+=`<path d="${path("F")}" fill="none" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3"/><path d="${path("M")}" fill="none" stroke="#1f2937" stroke-width="1.6"/>`;
  let last="";const nar=W<520;
  R.forEach((r,i)=>{const key=range==="2y"?r.d.slice(0,7):r.d.slice(0,4);
    const show=range==="2y"?(key!==last&&(nar?["01","07"]:["01","04","07","10"]).includes(r.d.slice(5,7))):(key!==last&&(+key)%(nar?4:2)===0);
    if(show)s+=`<text x="${x(i)}" y="${H-4}" text-anchor="middle">${range==="2y"?r.d.slice(2,4)+"."+r.d.slice(5,7):key}</text>`;last=key});
  s+=`<line id="hov" y1="${m.t}" y2="${H-18}" stroke="#1f2937" visibility="hidden"/></svg>`;
  box.innerHTML=s;
  const svg=box.querySelector("svg"),hov=svg.querySelector("#hov"),tip=$("#tip");
  svg.addEventListener("pointermove",ev=>{
    const rc=svg.getBoundingClientRect(),px=(ev.clientX-rc.left)*W/rc.width;
    const i=Math.max(0,Math.min(n-1,Math.round((px-m.l)/(W-m.l-m.r)*(n-1)))),r=R[i];
    hov.setAttribute("x1",x(i));hov.setAttribute("x2",x(i));hov.setAttribute("visibility","visible");
    tip.innerHTML=`<b>${r.d}</b><br>${CONFIG.priceName} ${CONFIG.price(r.k)}<br>Fundamentals 형세 ${n0(r.F)} / Momentum 기세 ${n0(r.M)}<br>${r.s?r.s+" "+STAGE[r.s].en+" "+STAGE[r.s].ko:"Pending"}`;
    tip.style.display="block";
    let lx=ev.clientX+14+scrollX;if(ev.clientX+240>innerWidth)lx=ev.clientX-230+scrollX;
    tip.style.left=lx+"px";tip.style.top=(rc.top+scrollY+8)+"px";});
  svg.addEventListener("pointerleave",()=>{tip.style.display="none";hov.setAttribute("visibility","hidden")});
}
function ticks(a,b){
  const out=[];for(let e=Math.floor(Math.log10(a));Math.pow(10,e)<=b;e++)for(const k of [1,2,5]){const v=k*Math.pow(10,e);if(v>=a&&v<=b)out.push(v)}
  if(out.length<3){out.length=0;const st=Math.pow(10,Math.floor(Math.log10((b-a)/3)));const step=Math.ceil((b-a)/4/st)*st;for(let v=Math.ceil(a/step)*step;v<=b;v+=step)out.push(v)}
  return out;
}
</script>
