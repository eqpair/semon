<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reflexivity Monitor Bitcoin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16181b;--ink2:#555b63;--ink3:#8f959d;--rule:#d5d9de;--rule2:#eaedf0;--panel:#f4f5f7;--bg:#fff;
  --boom:#c42f27;--bust:#24509f;
  --s1:#c3c8cf;--s2:#f0c5c1;--s3:#e2958c;--s4:#d25f54;--s5:#c42f27;
  --s6:#c4d1ea;--s7:#8fa8d8;--s8:#587dc4;--s9:#24509f;
  --f:"Archivo","IBM Plex Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.55 var(--f);font-variant-numeric:tabular-nums lining-nums}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 72px}
.num{font-stretch:78%;font-weight:600;letter-spacing:-.01em}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.up{color:var(--boom)} .dn{color:var(--bust)}

/* masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:18px 0 14px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand b{font-size:19px;font-weight:700;font-stretch:88%;letter-spacing:-.01em}
.brand span{font-size:14px;color:var(--ink2)}
.switch{display:inline-flex;border:1px solid var(--ink)}
.switch a{padding:5px 14px;font-size:13px;text-decoration:none}
.switch a[aria-current]{background:var(--ink);color:#fff}
.switch a:focus-visible{outline:2px solid var(--boom);outline-offset:2px}
.asof{display:flex;gap:28px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--rule);font-size:12.5px;color:var(--ink2)}
.asof dt{display:inline;color:var(--ink3);margin-right:6px}
.asof dd{display:inline;margin:0;color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:440px minmax(0,1fr);gap:40px;padding:34px 0 30px;border-bottom:1px solid var(--rule);align-items:center}
.dial svg{width:100%;height:auto;display:block}
.dial text{font-family:var(--f)}
.kicker{font-size:13px;color:var(--ink2);margin:0 0 4px}
.kicker .tag{display:inline-block;padding:1px 8px;margin-left:8px;font-size:12px;color:#fff;background:var(--c)}
.sname{margin:0;font-size:clamp(46px,6.4vw,76px);line-height:1;font-weight:650;font-stretch:84%;letter-spacing:-.03em}
.sname small{display:block;font-size:17px;font-weight:500;font-stretch:100%;letter-spacing:0;color:var(--ink2);margin-top:10px}
.sdesc{font-size:16px;margin:14px 0 0;max-width:36em}
.since{font-size:13px;color:var(--ink2);margin-top:8px}
.watch{margin-top:18px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13.5px;padding:9px 12px;border-left:3px solid var(--c);background:var(--panel);max-width:34em}
.watch > *{white-space:nowrap}
.pips{display:inline-flex;gap:3px}
.pips i{width:16px;height:5px;background:var(--rule)}
.pips i.on{background:var(--c)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:26px;border-top:1px solid var(--ink)}
.metrics div{padding:12px 14px 0 0}
.metrics .k{font-size:12.5px;color:var(--ink2)}
.metrics .k small{color:var(--ink3);margin-left:4px}
.metrics .v{font-size:40px;line-height:1.1}
.metrics .d{font-size:12.5px;color:var(--ink2)}

/* sections */
section{padding:40px 0 0}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:6px}
.sh h2{margin:0;font-size:19px;font-weight:650;font-stretch:90%;letter-spacing:-.01em}
.sh p{margin:0;font-size:13px;color:var(--ink2);max-width:44em}

/* drivers */
.drivers{display:grid;grid-template-columns:1fr 1fr;gap:44px}
.dh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 8px}
.dh h3{margin:0;font-size:16px;font-weight:600}
.dh h3 small{font-weight:400;color:var(--ink3);margin-left:6px;font-size:13px}
.dh .v{font-size:30px}
.dh .v small{font-size:12.5px;font-weight:400;font-stretch:100%;color:var(--ink2);margin-left:6px}
.scale{display:grid;grid-template-columns:136px 1fr 40px 48px;gap:12px;font-size:11.5px;color:var(--ink3);padding:0 0 4px;border-bottom:1px solid var(--rule)}
.scale span:nth-child(2){display:flex;justify-content:space-between}
.comp{border-bottom:1px solid var(--rule2)}
.comp summary{display:grid;grid-template-columns:136px 1fr 40px 48px;gap:12px;align-items:center;padding:9px 0;cursor:pointer;list-style:none}
.comp summary::-webkit-details-marker{display:none}
.comp summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.comp summary:hover .lab{text-decoration:underline;text-underline-offset:3px}
.comp .lab{font-size:14px;line-height:1.25}
.comp .lab small{display:block;font-size:11.5px;color:var(--ink3)}
.dv{position:relative;height:10px;background:var(--rule2)}
.dv::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--ink)}
.dv i{position:absolute;top:0;bottom:0}
.comp .sc{text-align:right;font-size:16px}
.comp .ch{text-align:right;font-size:12.5px}
.items{list-style:none;margin:0 0 12px;padding:6px 0 0}
.items li{display:grid;grid-template-columns:1fr auto 2.6em;gap:14px;font-size:12.5px;padding:3px 0 3px 12px;border-left:2px solid var(--rule)}
.items .r{color:var(--ink2);text-align:right}
.items .s{text-align:right}
.short{margin-top:16px;font-size:13px;color:var(--ink2);display:flex;gap:14px;align-items:baseline}
.short b{font-size:22px;color:var(--ink)}

/* charts */
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.65fr);gap:44px;padding-top:16px}
.box{position:relative}
.box svg{display:block;width:100%;height:auto;overflow:visible}
.box svg text{font:11.5px var(--f);fill:var(--ink2)}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{font:inherit;font-size:12.5px;background:none;border:0;padding:4px 12px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.seg button:focus-visible{outline:2px solid var(--boom);outline-offset:1px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:16px;border-top:2px solid var(--c);vertical-align:middle;margin-right:6px}
.legend span.dash::before{border-top-style:dashed}
.legend span.blk::before{border-top-width:8px;width:10px}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--ink);padding:7px 10px;font-size:12px;line-height:1.5;white-space:nowrap;display:none;z-index:3;font-variant-numeric:tabular-nums}

/* tables */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:44px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--rule2);white-space:nowrap}
th{font-weight:500;font-size:12px;color:var(--ink2);border-bottom:1px solid var(--rule);vertical-align:bottom}
th:first-child,td:first-child{text-align:left;padding-left:0}
td.st{display:flex;align-items:center;gap:8px}
td.st i{width:10px;height:10px;background:var(--c);flex:none}
td.st small{color:var(--ink3)}
tr.cur td{background:var(--panel);font-weight:600}
.note{font-size:12.5px;color:var(--ink2);margin:12px 0 0;max-width:62em}
.verdict{margin:14px 0 0;font-size:13.5px;padding:10px 12px;background:var(--panel)}
.method{font-size:12.5px;color:var(--ink2);columns:2;column-gap:44px;padding-top:12px}
.method p{margin:0 0 10px;break-inside:avoid}
.method b{color:var(--ink);font-weight:600}
.err{padding:48px 0;font-size:15px}

@media (max-width:980px){
  .hero{grid-template-columns:minmax(0,1fr);gap:20px}
  .dial{max-width:420px;margin:0 auto;width:100%}
  .drivers,.charts,.two{grid-template-columns:minmax(0,1fr);gap:32px}
  .method{columns:1}
}
@media (max-width:560px){
  .wrap{padding:0 16px 56px}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:6px}
  .scale,.comp summary{grid-template-columns:108px 1fr 34px 40px;gap:8px}
}
@media (prefers-reduced-motion:no-preference){
  .dial .cur{animation:arrive .9s ease-out both}
  @keyframes arrive{from{opacity:.15}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="brand"><b>Reflexivity Monitor</b><span id="mkt"></span></div>
    <nav class="switch" id="switch" aria-label="시장 선택"></nav>
  </header>
  <dl class="asof" id="asof"><div><dt>Loading</dt></div></dl>
  <main id="app"></main>
</div>
<div class="tip" id="tip"></div>
<script>
const CONFIG = {
  title:"Reflexivity Monitor — Bitcoin",
  market:"Bitcoin, BTC/USD",
  json:"data/reflex_btc.json",
  nav:[{href:"reflex.html",label:"Korea equities"},{href:"reflex_btc.html",label:"Bitcoin",cur:true}],
  dayUnit:"일", window:"3년(1,095일)", since:"2015", priceName:"BTC",
  perfBasis:"BTC",
  asof:d=>[["As of",d.asof+" UTC close"],["On-chain",d.src.onchain||"—"],["US data",d.src.macro||"—"],["Updated",d.gen]],
  price:v=>"$"+Math.round(v).toLocaleString("en-US"),
  tick:v=>"$"+(v>=1000?(v/1000).toLocaleString("en-US")+"k":v.toLocaleString("en-US")),
  method:`<p><b>Fundamentals</b>(형세)는 비트코인을 둘러싼 환경입니다. 연준 순유동성(대차대조표 − 재무부 계좌 − 역레포), 미국 실질금리, 달러인덱스, 나스닥과 VIX, 달러 스테이블코인 유통량 증가, 해시레이트와 활성 주소로 구성합니다.</p>
<p><b>Momentum</b>(기세)은 시장의 반응입니다. BTC의 60·120·200일선 이격과 120일 수익률, 무기한 선물 펀딩비, MVRV(시가총액/실현시가총액), 주요 알트코인 20종의 이평선 위 비율, 방향성 거래량으로 구성합니다.</p>
<p><b>Bias</b>는 Momentum에서 Fundamentals를 뺀 값으로, 소로스가 말한 시장의 지배적 편향(prevailing bias)에 해당합니다. 플러스면 기대가 현실을 앞서 있다는 뜻입니다.</p>
<p><b>Stage</b>는 Momentum의 수준과 21일 변화, Fundamentals의 90일 변화, Bias로 정합니다. 같은 판정이 5일 이어지고 직전 단계가 21일 이상 지났을 때만 바꾸며, Fundamentals가 40 미만일 때의 반등은 Acceleration으로 보지 않습니다. 규칙은 2015~2026년 데이터로 정했고, 완전한 사이클이 3~4번뿐이라 통계 표본이 작습니다. 국면을 설명하는 지표이며 매매 신호가 아닙니다.</p>`
};

const STAGE = {
  1:{en:"Inception",ko:"유리한 형세"},2:{en:"Acceleration",ko:"상승 기세"},3:{en:"Confirmation",ko:"현실 개선"},
  4:{en:"Conviction",ko:"확신 강화"},5:{en:"Overshoot",ko:"기세 가속"},6:{en:"Reversal",ko:"반전 시작"},
  7:{en:"Twilight",ko:"기세 약화"},8:{en:"Deterioration",ko:"현실 악화"},9:{en:"Capitulation",ko:"하락 가속"}
};
const HEX={1:"#c3c8cf",2:"#f0c5c1",3:"#e2958c",4:"#d25f54",5:"#c42f27",6:"#c4d1ea",7:"#8fa8d8",8:"#587dc4",9:"#24509f"};
const LIGHT=new Set([1,2,6]);
const PHASE=s=>s>=2&&s<=5?"Boom":s>=6?"Bust":"Base";
const COMP_EN={trend:"Trend",part:"Breadth",energy:"Volume",flow:"Flows",risk:"Risk appetite",semi:"Semiconductor cycle",
  fx:"KRW & dollar",rate:"Rates",cycle:"Growth",liq:"Dollar liquidity",stable:"Stablecoins",net:"Network",lev:"Leverage",
  val:"Valuation",breadth:"Alt breadth"};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n0=v=>v==null||isNaN(v)?"—":Math.round(v).toString();
const sg=(v,d=0)=>v==null||isNaN(v)?"—":(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(d);
const tone=v=>v==null?"":v>0?"up":v<0?"dn":"";
const fmtD=s=>s||"—";

/* JSON 스키마 차이(한국판 v2 / 비트코인판) 흡수 */
function norm(j){
  const st=j.stage_stats||{}, S={};
  for(const k in st){const s=st[k];S[k]={days:s.days,eps:s.episodes,len:s.avg_len,fwd:s.fwd??s.fwd60,ex:s.fwd_excess??s.fwd60_excess,
    hit:s.hit??s.hit60,vol:s.vol??s.vol60,mdd:s.mdd??s.mdd60}}
  const ax=(a,d,sd)=>({value:a.value,d:a.dslope??a[d],sd:a.slope_days??sd,components:a.components||{}});
  return {
    raw:j, stage:j.stage, summary:j.summary, gap:j.gap,
    F:ax(j.F,"d40",40), M:ax(j.M,"d20",20), Mf:{...ax(j.Mf,"d10",10),accel:j.Mf.accel},
    horizon:j.horizon??60, stats:S, base:j.baseline?.fwd??j.baseline?.f60,
    periods:(j.phase_by_period||[]).map(p=>({name:p.period,up:{ex:p.up.fwd_excess??p.up.fwd60_excess,hit:p.up.hit??p.up.hit60},
      dn:{ex:p.down.fwd_excess??p.down.fwd60_excess,hit:p.down.hit??p.down.hit60}})),
    trans:j.transitions||{}, eps:j.episodes_recent||[], hist:j.history||[], histLong:j.history_long||[],
    asof:j.as_of, src:j.sources_as_of||{us:j.us_as_of}, gen:j.generated_at
  };
}

document.title=CONFIG.title;
$("#mkt").textContent=CONFIG.market;
$("#switch").innerHTML=CONFIG.nav.map(n=>`<a href="${n.href}"${n.cur?' aria-current="page"':""}>${esc(n.label)}</a>`).join("");

fetch(CONFIG.json+"?v="+Date.now()).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(j=>render(norm(j))).catch(e=>{
  $("#app").innerHTML=`<p class="err">데이터를 불러오지 못했습니다 (${esc(e.message)}). ${esc(CONFIG.json)} 경로를 확인하세요.</p>`;
  $("#asof").innerHTML="";
});

function render(d){
  const st=d.stage, cur=st.id, ph=PHASE(cur), c=cur?HEX[cur]:"#999";
  $("#asof").innerHTML=CONFIG.asof(d).map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("");

  const pend=st.pending;
  const watch=pend?`<div class="watch" style="--c:${HEX[pend.id]}">
      <span>Transition watch</span><b>${STAGE[pend.id].en}</b>
      <span class="pips" aria-label="${pend.count}/${pend.need}일 확인">${Array.from({length:pend.need},(_,i)=>`<i class="${i<pend.count?"on":""}"></i>`).join("")}</span>
      <span class="muted">${pend.count}/${pend.need}일 확인</span></div>`:"";
  const tr=d.trans[String(cur)]||{};
  const nxt=Object.entries(tr).slice(0,3);

  let h=`
  <div class="hero">
    <div class="dial" id="dial"></div>
    <div>
      <p class="kicker">Stage ${cur??"—"} of 9 <span class="tag" style="--c:${ph==="Boom"?"var(--boom)":ph==="Bust"?"var(--bust)":"var(--ink3)"}">${ph} phase</span></p>
      <h1 class="sname">${cur?STAGE[cur].en:"Pending"}<small>${cur?STAGE[cur].ko:""}</small></h1>
      <p class="sdesc">${esc(st.desc||"")}</p>
      <div class="since">${st.since?`${st.since}부터 ${st.days}${CONFIG.dayUnit}째`:""}${nxt.length?` <span class="faint">/</span> 과거에 이 다음 온 단계: ${nxt.map(([k,p])=>`${STAGE[k].en} ${Math.round(p)}%`).join(", ")}`:""}</div>
      ${watch}
      <div class="metrics">
        ${metric("Fundamentals","형세",d.F.value,d.F.d,`${d.F.sd}일 변화`)}
        ${metric("Momentum","기세",d.M.value,d.M.d,`${d.M.sd}일 변화`)}
        ${metric("Short-term","단기",d.Mf.value,d.Mf.d,`${d.Mf.sd}일 변화`)}
        ${metric("Bias","M − F",d.gap,null,d.gap>0?"기대가 현실을 앞섬":d.gap<0?"현실이 기대를 앞섬":"균형",true)}
      </div>
    </div>
  </div>

  <section>
    <div class="sh"><h2>Drivers</h2><p>모든 지표는 과거 ${CONFIG.window} 대비 백분위. 50이 평소 수준이고 오른쪽(빨강)이 시장에 우호적입니다. 항목을 누르면 실제 값이 열립니다.</p></div>
    <div class="drivers">
      <div>${driverHead("Fundamentals","형세",d.F)}${scale()}${comps(d.F.components)}</div>
      <div>${driverHead("Momentum","기세",d.M)}${scale()}${comps(d.M.components)}
        <div class="short"><span>Short-term momentum</span><b class="num">${n0(d.Mf.value)}</b><span>${esc(d.raw.Mf.accel_text||"")}</span></div>
      </div>
    </div>
  </section>

  <section>
    <div class="sh"><h2>Phase map and history</h2><p>왼쪽은 최근 120${CONFIG.dayUnit}의 Fundamentals–Momentum 궤적, 오른쪽은 ${CONFIG.priceName}와 단계 이력입니다.</p></div>
    <div class="charts">
      <div class="box" id="plane"></div>
      <div>
        <div class="ctl">
          <div class="seg" role="group" aria-label="기간">
            <button type="button" data-r="2y" aria-pressed="true">2Y</button>
            <button type="button" data-r="all" aria-pressed="false">Since ${CONFIG.since}</button>
          </div>
          <div class="legend"><span style="--c:var(--ink)">Momentum</span><span class="dash" style="--c:var(--ink3)">Fundamentals</span>
            <span class="blk" style="--c:var(--s4)">Boom</span><span class="blk" style="--c:var(--s8)">Bust</span></div>
        </div>
        <div class="box" id="line"></div>
      </div>
    </div>
  </section>

  <section>
    <div class="two">
      <div>
        <div class="sh"><h2>Regime log</h2></div>
        <div class="scroll"><table>
          <thead><tr><th>Period</th><th>Stage</th><th>Days</th><th>${CONFIG.priceName}</th></tr></thead>
          <tbody>${d.eps.slice().reverse().map(e=>{const ch=e.k0&&e.k1?(e.k1/e.k0-1)*100:null;
            return `<tr><td>${e.start.slice(2)} – ${e.end.slice(2)}</td><td class="st" style="--c:${HEX[e.s]}"><i></i>${STAGE[e.s].en}</td>
              <td>${e.days}</td><td class="${tone(ch)}">${sg(ch,1)}%</td></tr>`}).join("")}</tbody>
        </table></div>
      </div>
      <div>
        <div class="sh"><h2>Forward performance by stage</h2></div>
        <div class="scroll"><table>
          <thead><tr><th>Stage</th><th>Days</th><th>Avg run</th><th>${d.horizon}D return</th><th>vs. avg</th><th>Hit rate</th><th>Max DD</th></tr></thead>
          <tbody>${[1,2,3,4,5,6,7,8,9].map(i=>{const s=d.stats[i]||{};return `<tr class="${i===cur?"cur":""}">
            <td class="st" style="--c:${HEX[i]}"><i></i>${i} ${STAGE[i].en}</td><td>${s.days??"—"}</td><td>${s.len!=null?Math.round(s.len):"—"}</td>
            <td class="${tone(s.fwd)}">${sg(s.fwd,1)}%</td><td class="${tone(s.ex)}">${sg(s.ex,1)}</td>
            <td>${s.hit!=null?Math.round(s.hit)+"%":"—"}</td><td>${s.mdd!=null?s.mdd.toFixed(1)+"%":"—"}</td></tr>`}).join("")}</tbody>
        </table></div>
        <p class="note">${CONFIG.since}년 이후 각 단계였던 날로부터 ${d.horizon}${CONFIG.dayUnit} 뒤까지의 ${esc(CONFIG.perfBasis)} 기록. vs. avg는 전체 평균 ${sg(d.base,1)}% 대비 차이(%p), Max DD는 그 기간 중 최대 낙폭 평균입니다.</p>
        ${robust(d)}
      </div>
    </div>
  </section>

  <section>
    <div class="sh"><h2>Methodology</h2></div>
    <div class="method">${CONFIG.method}</div>
  </section>`;
  $("#app").innerHTML=h;

  drawDial(d);
  drawPlane(d);
  let range="2y";
  const redraw=()=>drawLine(range==="2y"?d.hist:d.histLong,range);
  redraw();
  document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
    range=b.dataset.r;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));redraw();}));
  let t;window.addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(()=>{drawPlane(d);redraw()},150)});
}

function metric(en,ko,v,dv,lab,signed){
  return `<div><div class="k">${en}<small>${ko}</small></div><div class="v num ${signed?tone(v):""}">${signed?sg(v):n0(v)}</div>
    <div class="d">${dv!=null?`${lab} <span class="${tone(dv)}">${sg(dv)}</span>`:esc(lab)}</div></div>`;
}
function driverHead(en,ko,a){
  return `<div class="dh"><h3>${en}<small>${ko}</small></h3><div class="v num">${n0(a.value)}<small>${a.sd}일 <span class="${tone(a.d)}">${sg(a.d)}</span></small></div></div>`;
}
function scale(){return `<div class="scale"><span></span><span><span>0</span><span>50</span><span>100</span></span><span style="text-align:right">Score</span><span style="text-align:right">20D Δ</span></div>`}
function comps(cs){
  return Object.entries(cs).map(([k,c])=>{
    const v=c.score??50, left=Math.min(v,50), w=Math.abs(v-50);
    return `<details class="comp"><summary>
      <span class="lab">${COMP_EN[k]||esc(c.label)}<small>${esc(c.label)} ${Math.round(c.weight*100)}%</small></span>
      <span class="dv"><i style="left:${left}%;width:${w}%;background:${v>=50?"var(--boom)":"var(--bust)"}"></i></span>
      <span class="sc num">${n0(c.score)}</span><span class="ch ${tone(c.d20)}">${sg(c.d20)}</span></summary>
      <ul class="items">${c.items.map(i=>`<li><span>${esc(i.label)}</span><span class="r">${esc(i.disp)}</span><span class="s num">${n0(i.score)}</span></li>`).join("")}</ul>
    </details>`}).join("");
}
function robust(d){
  if(!d.periods.length)return "";
  const same=d.periods.every(p=>p.up.ex>0&&p.dn.ex<0);
  return `<div class="scroll" style="margin-top:22px"><table><thead><tr><th>Period check</th><th>Boom vs. avg</th><th>Hit</th><th>Bust vs. avg</th><th>Hit</th></tr></thead>
    <tbody>${d.periods.map(p=>`<tr><td>${esc(p.name)}</td><td class="${tone(p.up.ex)}">${sg(p.up.ex,1)}</td><td>${Math.round(p.up.hit)}%</td>
      <td class="${tone(p.dn.ex)}">${sg(p.dn.ex,1)}</td><td>${Math.round(p.dn.hit)}%</td></tr>`).join("")}</tbody></table></div>
    <p class="verdict">${same?"두 기간 모두 Boom 구간이 평균보다 좋았고 Bust 구간이 나빴습니다. 다만 표본이 작아 우연일 가능성은 남아 있습니다."
      :"기간에 따라 결과가 달랐습니다. 이 단계는 국면을 설명하는 지표이고 매매 신호로 쓰기엔 근거가 부족합니다."}</p>`;
}

/* ── 사이클 다이얼: 5단계가 꼭대기, 왼쪽 반원 Boom, 오른쪽 반원 Bust ── */
function drawDial(d){
  const W=480,H=440,cx=W/2,cy=H/2+4,R=134,w=30,cur=d.stage.id,pend=d.stage.pending?.id;
  const ang=k=>(k-5)*40, rad=a=>(a-90)*Math.PI/180;
  const pt=(a,r)=>[cx+r*Math.cos(rad(a)),cy+r*Math.sin(rad(a))];
  const arc=(a0,a1,r0,r1)=>{const [x0,y0]=pt(a0,r1),[x1,y1]=pt(a1,r1),[x2,y2]=pt(a1,r0),[x3,y3]=pt(a0,r0);
    return `M${x0} ${y0}A${r1} ${r1} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 0 0 ${x3} ${y3}Z`};
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="9단계 사이클 중 현재 ${cur}단계 ${cur?STAGE[cur].en:""}">`;
  s+=`<defs><marker id="ah" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L6 3L0 6z" fill="#8f959d"/></marker></defs>`;
  for(let k=1;k<=9;k++){
    const a=ang(k),on=k===cur;
    s+=`<path class="${on?"cur":""}" d="${arc(a-19,a+19,R-w/2-(on?7:0),R+w/2+(on?7:0))}" fill="${HEX[k]}" fill-opacity="${on?1:.4}" ${on?'stroke="#16181b" stroke-width="1.5"':""}/>`;
    if(k===pend)s+=`<path d="${arc(a-19,a+19,R-w/2-3,R+w/2+3)}" fill="none" stroke="#16181b" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    const [nx,ny]=pt(a,R);
    s+=`<text x="${nx}" y="${ny+4}" text-anchor="middle" style="font-size:12px;font-weight:600;fill:${on&&!LIGHT.has(k)?"#fff":"#16181b"}">${k}</text>`;
    const [lx,ly]=pt(a,R+w/2+(on?18:12)),anc=Math.abs(a)<12?"middle":a<0?"end":"start",dy=Math.abs(a)<12?-2:Math.abs(a)>120?10:4;
    s+=`<text x="${lx}" y="${ly+dy}" text-anchor="${anc}" style="font-size:${on?13:12}px;fill:${on?"#16181b":"#8f959d"};font-weight:${on?650:400}">${STAGE[k].en}</text>`;
  }
  const [ax0,ay0]=pt(168,R),[ax1,ay1]=pt(192,R);
  s+=`<path d="M${ax0} ${ay0}A${R} ${R} 0 0 1 ${ax1} ${ay1}" fill="none" stroke="#8f959d" stroke-dasharray="2 3" marker-end="url(#ah)"/>`;
  const [bx,by]=pt(-128,R-w/2-14),[ux,uy]=pt(128,R-w/2-14);
  s+=`<text x="${bx}" y="${by+4}" text-anchor="start" style="font-size:12px;fill:#c42f27;font-weight:600">Boom</text>`;
  s+=`<text x="${ux}" y="${uy+4}" text-anchor="end" style="font-size:12px;fill:#24509f;font-weight:600">Bust</text>`;
  s+=`<text x="${cx}" y="${cy-30}" text-anchor="middle" style="font-size:12px;fill:#555b63">Bias</text>`;
  s+=`<text x="${cx}" y="${cy+14}" text-anchor="middle" style="font-size:46px;font-weight:600;font-stretch:78%;fill:${d.gap>0?"#c42f27":d.gap<0?"#24509f":"#16181b"}">${sg(d.gap)}</text>`;
  s+=`<text x="${cx}" y="${cy+36}" text-anchor="middle" style="font-size:11px;fill:#8f959d">Momentum − Fundamentals</text>`;
  $("#dial").innerHTML=s+"</svg>";
}

/* ── Phase map ── */
function drawPlane(d){
  const box=$("#plane"), W=box.clientWidth||380, H=W, m={l:36,r:10,t:10,b:38};
  const x=v=>m.l+(W-m.l-m.r)*v/100, y=v=>H-m.b-(H-m.t-m.b)*v/100;
  const P=d.hist.slice(-120).filter(p=>p.F!=null&&p.M!=null);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fundamentals와 Momentum 위상 평면, 최근 120일 궤적">`;
  s+=`<path d="M${x(0)} ${y(0)}L${x(100)} ${y(100)}L${x(0)} ${y(100)}Z" fill="#c42f27" fill-opacity=".035"/>`;
  s+=`<path d="M${x(0)} ${y(0)}L${x(100)} ${y(100)}L${x(100)} ${y(0)}Z" fill="#24509f" fill-opacity=".035"/>`;
  s+=`<rect x="${x(0)}" y="${y(100)}" width="${x(100)-x(0)}" height="${y(0)-y(100)}" fill="none" stroke="#d5d9de"/>`;
  s+=`<line x1="${x(50)}" x2="${x(50)}" y1="${y(0)}" y2="${y(100)}" stroke="#eaedf0"/><line x1="${x(0)}" x2="${x(100)}" y1="${y(50)}" y2="${y(50)}" stroke="#eaedf0"/>`;
  s+=`<line x1="${x(0)}" y1="${y(0)}" x2="${x(100)}" y2="${y(100)}" stroke="#8f959d" stroke-dasharray="3 4"/>`;
  s+=`<text x="${x(4)}" y="${y(93)}">Momentum leads</text><text x="${x(96)}" y="${y(5)}" text-anchor="end">Fundamentals lead</text>`;
  [0,50,100].forEach(v=>{s+=`<text x="${x(v)}" y="${H-m.b+16}" text-anchor="middle">${v}</text><text x="${m.l-7}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
  s+=`<text x="${x(50)}" y="${H-4}" text-anchor="middle" style="fill:#16181b">Fundamentals</text>`;
  s+=`<text transform="translate(10 ${y(50)}) rotate(-90)" text-anchor="middle" style="fill:#16181b">Momentum</text>`;
  for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i];
    s+=`<line x1="${x(a.F)}" y1="${y(a.M)}" x2="${x(b.F)}" y2="${y(b.M)}" stroke="#16181b" stroke-opacity="${(.1+.9*i/P.length).toFixed(2)}" stroke-width="1.5"/>`}
  P.forEach((p,i)=>{if(i%20===0&&i<P.length-1)s+=`<circle cx="${x(p.F)}" cy="${y(p.M)}" r="3" fill="${HEX[p.s]||"#ccc"}" stroke="#fff"/>`});
  const F0=P[0],L=P[P.length-1];
  if(F0)s+=`<text x="${x(F0.F)+7}" y="${y(F0.M)+4}" style="fill:#8f959d">${F0.d.slice(2)}</text>`;
  if(L)s+=`<circle cx="${x(L.F)}" cy="${y(L.M)}" r="7" fill="${HEX[L.s]||"#16181b"}" stroke="#16181b" stroke-width="2"/><text x="${x(L.F)+12}" y="${y(L.M)+4}" style="fill:#16181b;font-weight:600">Now</text>`;
  box.innerHTML=s+"</svg>";
}

/* ── Price with stage bands + F/M ── */
function drawLine(rows,range){
  const box=$("#line"),W=box.clientWidth||620,H1=180,G=16,H2=140,H=H1+G+H2+22,m={l:52,r:6,t:4};
  const R=rows.filter(r=>r.k!=null),n=R.length,x=i=>m.l+(W-m.l-m.r)*i/(n-1);
  const ks=R.map(r=>Math.log(r.k)),lo=Math.min(...ks),hi=Math.max(...ks);
  const yk=v=>m.t+H1-6-(H1-12)*(Math.log(v)-lo)/(hi-lo), y2=v=>m.t+H1+G+H2-H2*v/100;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${CONFIG.priceName}와 단계, Fundamentals·Momentum 추이">`;
  let st=0;
  for(let i=1;i<=n;i++){if(i===n||R[i].s!==R[st].s){if(R[st].s){const x0=x(Math.max(st-.5,0)),x1=x(Math.min(i-.5,n-1));
    s+=`<rect x="${x0}" y="${m.t}" width="${Math.max(x1-x0,.5)}" height="${H1}" fill="${HEX[R[st].s]}" fill-opacity="${LIGHT.has(R[st].s)?.5:.28}"/>`}st=i}}
  ticks(Math.exp(lo),Math.exp(hi)).forEach(v=>{s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yk(v)}" y2="${yk(v)}" stroke="#fff" stroke-opacity=".8"/><text x="${m.l-6}" y="${yk(v)+4}" text-anchor="end">${CONFIG.tick(v)}</text>`});
  s+=`<path d="${R.map((r,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+yk(r.k).toFixed(1)).join("")}" fill="none" stroke="#16181b" stroke-width="1.5"/>`;
  s+=`<text x="${m.l+6}" y="${m.t+15}" style="fill:#16181b">${CONFIG.priceName} (log)</text>`;
  [0,50,100].forEach(v=>{s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y2(v)}" y2="${y2(v)}" stroke="${v===50?"#d5d9de":"#eaedf0"}"/><text x="${m.l-6}" y="${y2(v)+4}" text-anchor="end">${v}</text>`});
  const path=k=>R.map((r,i)=>r[k]==null?"":((i&&R[i-1][k]!=null?"L":"M")+x(i).toFixed(1)+" "+y2(r[k]).toFixed(1))).join("");
  s+=`<path d="${path("F")}" fill="none" stroke="#8f959d" stroke-width="1.4" stroke-dasharray="4 3"/><path d="${path("M")}" fill="none" stroke="#16181b" stroke-width="1.6"/>`;
  let last="";const nar=W<520;
  R.forEach((r,i)=>{const key=range==="2y"?r.d.slice(0,7):r.d.slice(0,4);
    const show=range==="2y"?(key!==last&&(nar?["01","07"]:["01","04","07","10"]).includes(r.d.slice(5,7))):(key!==last&&(+key)%(nar?4:2)===0);
    if(show)s+=`<text x="${x(i)}" y="${H-4}" text-anchor="middle">${range==="2y"?r.d.slice(2,4)+"."+r.d.slice(5,7):key}</text>`;last=key});
  s+=`<line id="hov" y1="${m.t}" y2="${H-18}" stroke="#16181b" visibility="hidden"/></svg>`;
  box.innerHTML=s;
  const svg=box.querySelector("svg"),hov=svg.querySelector("#hov"),tip=$("#tip");
  svg.addEventListener("pointermove",ev=>{
    const rc=svg.getBoundingClientRect(),px=(ev.clientX-rc.left)*W/rc.width;
    const i=Math.max(0,Math.min(n-1,Math.round((px-m.l)/(W-m.l-m.r)*(n-1)))),r=R[i];
    hov.setAttribute("x1",x(i));hov.setAttribute("x2",x(i));hov.setAttribute("visibility","visible");
    tip.innerHTML=`<b>${r.d}</b><br>${CONFIG.priceName} ${CONFIG.price(r.k)}<br>Fundamentals ${n0(r.F)} / Momentum ${n0(r.M)}<br>${r.s?r.s+" "+STAGE[r.s].en:"Pending"}`;
    tip.style.display="block";
    let lx=ev.clientX+14+scrollX;if(ev.clientX+200>innerWidth)lx=ev.clientX-190+scrollX;
    tip.style.left=lx+"px";tip.style.top=(rc.top+scrollY+8)+"px";});
  svg.addEventListener("pointerleave",()=>{tip.style.display="none";hov.setAttribute("visibility","hidden")});
}
function ticks(a,b){
  const out=[];for(let e=Math.floor(Math.log10(a));Math.pow(10,e)<=b;e++)for(const k of [1,2,5]){const v=k*Math.pow(10,e);if(v>=a&&v<=b)out.push(v)}
  if(out.length<3){out.length=0;const st=Math.pow(10,Math.floor(Math.log10((b-a)/3)));const step=Math.ceil((b-a)/4/st)*st;for(let v=Math.ceil(a/step)*step;v<=b;v+=step)out.push(v)}
  return out;
}
</script>
