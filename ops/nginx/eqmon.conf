server {
    server_name eqmon.duckdns.org;

    location / {
        auth_basic "EQ Monitor";
        auth_basic_user_file /etc/nginx/.htpasswd;
        root /var/www/html;
        index index.html;
    }

    location /api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /live.json {
        auth_basic off;
        alias /home/ubuntu/shmon/web/live.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }
    location /signals.json {
        auth_basic off;
        alias /home/ubuntu/semon/docs/data/signals.json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/eqmon.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eqmon.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = eqmon.duckdns.org) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name eqmon.duckdns.org;
    return 404;
}
